<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>George L. Hardy, PharmD — Interview Conversation Guide</title>
</head>
<body>
  <p style="font-family:Arial,sans-serif;padding:24px">Loading interview guide…</p>
  <script>
    fetch('https://raw.githubusercontent.com/resumes-lgtm/interview/main/index.html')
      .then(function(response){
        if(!response.ok) throw new Error('Unable to load guide');
        return response.text();
      })
      .then(function(html){
        document.open();
        document.write(html);
        document.close();
      })
      .catch(function(){
        document.body.innerHTML='<p style="font-family:Arial,sans-serif;padding:24px">The interview guide could not be loaded.</p>';
      });
  </script>
</body>
</html>
